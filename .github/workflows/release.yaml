# .github/workflows/release.ymlname: Releaseon:  push:    tags:      - 'v*'permissions:  contents: writejobs:  release:    strategy:      fail-fast: false      matrix:        os: [macos-latest, windows-latest, ubuntu-latest]    runs-on: ${{ matrix.os }}    steps:      - uses: actions/checkout@v4      - uses: actions/setup-node@v4        with:          node-version: 20      - name: Instalar dependências        working-directory: tray        run: npm install      - name: Build e publicar        working-directory: tray        run: npm run publish        env:          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}